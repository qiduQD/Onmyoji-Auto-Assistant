name: Build macOS App for Auto Assistant

on:
  push:
    branches: [ "mac-only" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    # 1. 拉取仓库 mac-only 分支的代码
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        ref: 'mac-only'

    # 2. 设置 Python 环境（升级到 3.12 以适配高版本 numpy）
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    # 3. 安装依赖库
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        pip install opencv-python pillow

    # 4. 执行 PyInstaller 打包
    - name: Build with PyInstaller
      run: |
        pyinstaller --clean \
          --onefile \
          --windowed \
          --add-data "assets:assets" \
          --name "OnmyojiAssistant" \
          --hidden-import=cv2 \
          --hidden-import=PIL \
          gui_main.py

    # 5. 将生成的 OnmyojiAssistant.app 打包成 zip
    - name: Compress App Bundle
      run: |
        cd dist
        zip -r ../OnmyojiAssistant-Mac.zip OnmyojiAssistant.app

    # 6. 上传打包好的 zip 文件
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: OnmyojiAssistant-Mac-Build
        path: OnmyojiAssistant-Mac.zip